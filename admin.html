<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor লোকেশন — শুধু মালিকের জন্য</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#667085;--accent:#0b6bcb;--line:#e4e7ec;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d222a;--text:#eef0f3;--muted:#9aa4b2;--accent:#5aa7ff;--line:#2c333d}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.2rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.big{font-size:1.1rem;font-weight:600;word-break:break-all}
.meta,.empty{color:var(--muted);font-size:.86rem;margin-top:4px}
.btn{display:inline-block;padding:12px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:.95rem;text-decoration:none;cursor:pointer;margin-top:10px;margin-right:8px}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
.err{color:var(--bad);font-size:.86rem;margin-top:8px;min-height:1.2em}
</style></head><body><main>
<h1>🔒 যারা লোকেশন শেয়ার করেছেন</h1>

<div id="login" class="card" style="display:none">
  <input id="key" type="password" placeholder="গোপন পাসওয়ার্ড" autocomplete="current-password">
  <button id="go" class="btn" type="button">ঢুকুন</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="bar" style="display:none;margin-bottom:10px">
  <button id="refresh" class="btn alt" type="button">↻ রিফ্রেশ</button>
  <button id="logout" class="btn alt" type="button">লগআউট</button>
</div>

<div id="list"></div>

<script>
var K = 'adminKey', $ = function (i) { return document.getElementById(i); };
function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function ago(ms) {
  var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + ' সেকেন্ড আগে';
  if (s < 3600) return Math.round(s / 60) + ' মিনিট আগে';
  if (s < 86400) return Math.round(s / 3600) + ' ঘণ্টা আগে';
  return new Date(ms).toLocaleString('bn-BD');
}

function showLogin(msg) {
  $('login').style.display = 'block';
  $('bar').style.display = 'none';
  $('list').textContent = '';
  if (msg) $('loginErr').textContent = msg;
}
function showPanel() {
  $('login').style.display = 'none';
  $('loginErr').textContent = '';
  $('bar').style.display = 'block';
}

function load() {
  var key = localStorage.getItem(K) || '';
  fetch('/api/visitors', { headers: { 'x-key': key } })
    .then(function (r) {
      if (r.status === 401) {
        localStorage.removeItem(K);
        showLogin(key ? 'ভুল পাসওয়ার্ড। আবার চেষ্টা করুন।' : '');
        return null;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (v) {
      if (!v) return;
      showPanel();
      var box = $('list'); box.textContent = '';
      if (!v.length) { box.appendChild(el('p', 'empty', 'এখনো কেউ শেয়ার করেননি।')); return; }
      v.forEach(function (x) {
        var c = el('div', 'card');
        c.appendChild(el('div', 'big', x.lat.toFixed(6) + ', ' + x.lng.toFixed(6)));
        c.appendChild(el('div', 'meta',
          (x.acc != null ? '±' + Math.round(x.acc) + ' মিটার · ' : '') + ago(x.t)));
        var a = el('a', 'btn alt', 'Google Maps-এ খুলুন');
        a.href = 'https://www.google.com/maps?q=' + x.lat + ',' + x.lng;
        a.target = '_blank'; a.rel = 'noopener';
        c.appendChild(a);
        box.appendChild(c);
      });
    })
    .catch(function (e) {
      showLogin('লোড করা যায়নি: ' + e.message);
    });
}

$('go').onclick = function () {
  var k = $('key').value.trim();
  if (!k) { $('loginErr').textContent = 'পাসওয়ার্ড দিন।'; return; }
  localStorage.setItem(K, k);
  load();
};
$('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
$('refresh').onclick = load;
$('logout').onclick = function () {
  localStorage.removeItem(K);
  showLogin('');
};

load();
</script>
</main></body></html>
